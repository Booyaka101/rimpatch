name: Published artifacts

# Exercises what a stranger actually consumes: the released action tag and the
# published package, rather than the working tree.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  action-from-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean run via the released action
        uses: Booyaka101/rimpatch@v1
        with:
          repo: tests/fixtures/patcher
          mods: tests/fixtures/base
      - name: Findings run via the released action
        id: broken
        continue-on-error: true
        uses: Booyaka101/rimpatch@v1
        with:
          repo: tests/fixtures/sequence
      - run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "the released action should fail on findings"; exit 1
          fi
          if [ "${{ steps.broken.outputs.findings }}" != "1" ]; then
            echo "expected 1 finding, got ${{ steps.broken.outputs.findings }}"; exit 1
          fi

  action-from-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Released action installing the published package
        uses: Booyaka101/rimpatch@v1
        with:
          repo: tests/fixtures/patcher
          mods: tests/fixtures/base
          version: "1.0.0"

  package-from-pypi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install rimpatch
        run: python -m pip install rimpatch==1.0.0
      - name: It runs and reports the expected finding
        shell: bash
        env:
          RIMPATCH_NO_AUTODETECT: "1"
        run: |
          rimpatch --version
          rimpatch check --no-game --mods tests/fixtures/base --mods tests/fixtures/patcher
          status=0
          rimpatch check --no-game --mods tests/fixtures/patcher || status=$?
          if [ "$status" -ne 1 ]; then echo "expected exit 1, got $status"; exit 1; fi
