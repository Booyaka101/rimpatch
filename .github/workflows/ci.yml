name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Unit tests
        env:
          RIMPATCH_NO_AUTODETECT: "1"
        run: python -m pytest -m "not integration"
      - name: Combat Extended corpus
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pytest -m integration

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel into a clean venv and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/rimpatch --help
          /tmp/clean/bin/rimpatch check \
            --mods tests/fixtures/base --mods tests/fixtures/patcher
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A patch whose target is loaded passes
        uses: ./
        with:
          repo: tests/fixtures/patcher
          mods: tests/fixtures/base
      # tests/fixtures/sequence declares no modDependencies, so nothing is resolved
      # from its siblings and its patch has nothing to land on.
      - name: A patch whose target is missing fails
        id: broken
        continue-on-error: true
        uses: ./
        with:
          repo: tests/fixtures/sequence
      - name: The failing run must have reported findings
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "expected the action to fail on findings"; exit 1
          fi
          if [ "${{ steps.broken.outputs.findings }}" != "1" ]; then
            echo "expected 1 finding, got ${{ steps.broken.outputs.findings }}"; exit 1
          fi
      - name: fail-on-findings false reports without failing
        id: soft
        uses: ./
        with:
          repo: tests/fixtures/sequence
          fail-on-findings: "false"
      - run: |
          if [ "${{ steps.soft.outputs.findings }}" != "1" ]; then
            echo "expected the finding to still be reported"; exit 1
          fi
