name: rimpatch
description: Find RimWorld PatchOperations that no longer resolve, without launching the game.
author: Christiaan Bosch
branding:
  icon: crosshair
  color: orange

inputs:
  repo:
    description: Checkout to check as a mod. Its modDependencies are resolved from sibling folders.
    required: false
    default: "."
  mods:
    description: Extra mod folders, one per line. Each is a mod folder or a folder of mod folders.
    required: false
    default: ""
  game:
    description: RimWorld install root, if the runner has one. Loads Core and the expansions.
    required: false
    default: ""
  mods-config:
    description: Path to a ModsConfig.xml to take the active list and load order from.
    required: false
    default: ""
  game-version:
    description: Version used for LoadFolders and version subfolders, for example 1.6.
    required: false
    default: ""
  baseline:
    description: Baseline file of accepted findings, so only new ones fail the build.
    required: false
    default: ""
  strict:
    description: Also report operations whose success mode hides the failure.
    required: false
    default: "false"
  warnings:
    description: Show warnings such as duplicate defNames.
    required: false
    default: "true"
  fail-on-findings:
    description: Fail the step when there are findings.
    required: false
    default: "true"
  version:
    description: Version of the rimpatch package to install, for example 1.0.0.
    required: false
    default: ""
  python-version:
    description: Python version to set up.
    required: false
    default: "3.12"

outputs:
  findings:
    description: Number of findings.
    value: ${{ steps.run.outputs.findings }}
  report:
    description: Path to the JSON report written by the action.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install rimpatch
      shell: bash
      run: |
        if [ -f "${{ github.action_path }}/pyproject.toml" ] && [ -z "${{ inputs.version }}" ]; then
          python -m pip install --disable-pip-version-check "${{ github.action_path }}"
        elif [ -n "${{ inputs.version }}" ]; then
          python -m pip install --disable-pip-version-check "rimpatch==${{ inputs.version }}"
        else
          python -m pip install --disable-pip-version-check rimpatch
        fi

    - name: Run rimpatch
      id: run
      shell: bash
      env:
        # A CI result must not depend on whether the runner happens to have RimWorld
        # installed; the `game` input is the only way vanilla defs get loaded here.
        RIMPATCH_NO_AUTODETECT: "1"
        RIMPATCH_REPO: ${{ inputs.repo }}
        RIMPATCH_MODS: ${{ inputs.mods }}
        RIMPATCH_GAME: ${{ inputs.game }}
        RIMPATCH_MODS_CONFIG: ${{ inputs.mods-config }}
        RIMPATCH_GAME_VERSION: ${{ inputs.game-version }}
        RIMPATCH_BASELINE: ${{ inputs.baseline }}
        RIMPATCH_STRICT: ${{ inputs.strict }}
        RIMPATCH_WARNINGS: ${{ inputs.warnings }}
        RIMPATCH_FAIL: ${{ inputs.fail-on-findings }}
      run: |
        args=(check --repo "$RIMPATCH_REPO")
        while IFS= read -r line; do
          if [ -n "$line" ]; then args+=(--mods "$line"); fi
        done <<< "$RIMPATCH_MODS"
        if [ -n "$RIMPATCH_GAME" ]; then args+=(--game "$RIMPATCH_GAME"); fi
        if [ -n "$RIMPATCH_MODS_CONFIG" ]; then args+=(--mods-config "$RIMPATCH_MODS_CONFIG"); fi
        if [ -n "$RIMPATCH_GAME_VERSION" ]; then args+=(--game-version "$RIMPATCH_GAME_VERSION"); fi
        if [ -n "$RIMPATCH_BASELINE" ]; then args+=(--baseline "$RIMPATCH_BASELINE"); fi
        if [ "$RIMPATCH_STRICT" = "true" ]; then args+=(--strict); fi
        if [ "$RIMPATCH_WARNINGS" = "false" ]; then args+=(--no-warnings); fi

        report="$RUNNER_TEMP/rimpatch-report.json"
        status=0
        rimpatch "${args[@]}" --format json --exit-zero > "$report" || status=$?
        if [ "$status" -gt 1 ]; then
          echo "::error::rimpatch could not run, see the message above"
          exit "$status"
        fi
        count=$(python -c "import json,sys;print(len(json.load(open(sys.argv[1]))['findings']))" "$report")
        {
          echo "report=$report"
          echo "findings=$count"
        } >> "$GITHUB_OUTPUT"

        status=0
        rimpatch "${args[@]}" --format github || status=$?
        if [ "$status" -gt 1 ]; then exit "$status"; fi
        if [ "$status" -eq 1 ] && [ "$RIMPATCH_FAIL" = "true" ]; then exit 1; fi
